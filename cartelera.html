<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine a Distancia 🍿</title>
    <style>
        body {
            background: linear-gradient(135deg, #FFB6C1, #ADD8E6);
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #4a4a4a;
            min-height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); max-width: 500px; width: 90%;
        }
        h2 { color: #d63384; margin-bottom: 5px; }
        .peli {
            background: #fff; padding: 15px; margin: 15px 0; border-radius: 10px; border-left: 5px solid #87CEFA; text-align: left; font-weight: bold;
        }
        .btn-regresar {
            display: inline-block; margin-top: 20px; background-color: #87CEFA; color: #fff; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; border: 2px solid #FFB6C1; transition: 0.3s;
        }
        .btn-regresar:hover { background-color: #FFC0CB; border-color: #87CEFA; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Cine a Distancia 🍿</h2>
        <p>Nuestras noches de películas. ¿Qué veremos la próxima vez?</p>
        
        <div class="peli">🎬 (Escribe aquí una película romántica que quieran ver)</div>
        <div class="peli">👻 (Escribe aquí una película de terror para que se abracen a la distancia)</div>
        <div class="peli">😂 (Escribe aquí una película de comedia)</div>

        <a href="index.html" class="btn-regresar">⬅ Regresar al Menú</a>
    </div>
</body>
</html>
