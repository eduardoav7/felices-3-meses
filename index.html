<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felices 3 meses, mi princesita hermosa 💞</title>
    <style>
        body {
            /* Un degradado hermoso de rosa clarito a azul */
            background: linear-gradient(135deg, #FFB6C1, #ADD8E6); 
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #4a4a4a;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 85%;
        }
        h1 { 
            color: #d63384; /* Rosa un poco más fuerte para que resalte */
            margin-bottom: 5px;
        }
        .fecha {
            font-size: 0.9em;
            color: #6c757d;
            margin-bottom: 20px;
        }
        .menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        .btn {
            background-color: #87CEFA; /* Azul clarito */
            color: #ffffff;
            padding: 15px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #FFB6C1; /* Borde rosa clarito */
        }
        .btn:hover {
            background-color: #FFC0CB; /* Cambia a rosa al pasar el mouse */
            color: #ffffff;
            transform: scale(1.05);
            border-color: #87CEFA;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Para Mi Niña 💙🩷</h1>
        <p class="fecha">14 de junio 2026 - 14 de septiembre 2026</p>
        <p>A pesar de la distancia, cada día a tu lado es una aventura. ¿Qué quieres ver primero?</p>

        <div class="menu">
            <a href="carta.html" class="btn">💌 Una carta para ti</a>
            <a href="galeria.html" class="btn">🎮 Nuestras Aventuras</a>
            <a href="cartelera.html" class="btn">🍿 Cine a Distancia</a>
            <a href="playlist.html" class="btn">🎶 Nuestra Sintonía</a>
            <a href="contador.html" class="btn">⏳ Nuestro Tiempo</a>
            <a href="juego.html" class="btn">❓ Trivia de Nosotros</a>
        </div>
    </div>
</body>
</html>
